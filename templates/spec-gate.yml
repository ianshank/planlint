# Drop into .github/workflows/spec-gate.yml in the target repository.
#
# Pins the composite action to an exact tag equal to this repository's
# package version. The `uses:` ref is the CLI: the action installs planlint
# from its own checkout unless `version` is set. Do not use a floating
# major tag such as @v1.
name: spec-gate

on:
  pull_request:
    paths:
      # Both spec-tree layouts planlint understands: an OpenSpec `openspec/`
      # tree and a SpecKit `specs/` tree. Listing only the former meant a
      # SpecKit repo never triggered the gate it had just installed.
      - "openspec/**"
      - "specs/**"
      - "Makefile"
      - "pyproject.toml"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  specs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # delete this line if code scanning is off
      actions: read           # required only on a private repository
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ianshank/planlint/.github/actions/planlint@v0.2.0
        # Pin to a full SHA instead of the tag if you need a bit-for-bit lock:
        # uses: ianshank/planlint/.github/actions/planlint@<full-sha>
