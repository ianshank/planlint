# Drop into .github/workflows/spec-gate.yml in the target repository.
#
# One step runs the gate. Everything it needs is in this file, so the
# permissions the job holds are visible to whoever grants them rather than
# hidden inside an action they call.
#
# Deliberately the `pull_request` event, and never the `_target` variant of
# it: this workflow checks out and scans the contents of the pull request,
# which on a fork is untrusted, and that variant would hand the same checkout
# write permissions and secrets. `pull_request` gives it a read-only token and
# none, which is exactly the posture a linter wants.
name: spec-gate

on:
  pull_request:
    paths:
      # Both spec-tree layouts planlint understands: an OpenSpec `openspec/`
      # tree and a SpecKit `specs/` tree. Listing only the former meant a
      # SpecKit repo never triggered the gate it had just installed.
      - "openspec/**"
      - "specs/**"
      - "Makefile"
      - "pyproject.toml"
      # This file itself, so the pull request that installs the gate is the
      # first one the gate runs on. Without it a reviewer merges a workflow
      # nobody has seen execute.
      - ".github/workflows/spec-gate.yml"
  push:
    # The default-branch run is what code scanning uses as the baseline a pull
    # request's alerts are compared against.
    branches: [main]
  workflow_dispatch:

# Least privilege, stated rather than inherited: anything not listed is `none`.
permissions:
  # Everything the scan itself needs.
  contents: read
  # Only for the optional SARIF upload below. Delete this line and that step
  # together if the repository does not have code scanning enabled -- with the
  # step removed the gate still fails the build, it just reports through
  # annotations and the job summary instead of the Security tab.
  security-events: write

jobs:
  specs:
    name: Validate executable specs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The scan needs no credentials, so it should not be handed any: an
          # unused token left in the checkout's git config is reachable by
          # anything else that runs in this job.
          persist-credentials: false

      # Pinned to an exact release tag. The tag pins the adapter and the CLI
      # together, so nothing floats underneath a green build. For a stricter
      # supply chain, pin the full commit sha instead:
      #   uses: ianshank/planlint/.github/actions/planlint@<40-character sha>
      - id: planlint
        uses: ianshank/planlint/.github/actions/planlint@v0.2.0
        with:
          target: "."
          fail-on: ERROR

      # Optional. Puts each finding on the diff in the Security tab, on top of
      # the inline annotations the action already emits. Skipped rather than
      # failed where it cannot work: a fork's token is read-only, and a
      # repository without code scanning rejects the upload for reasons that
      # have nothing to do with its specs.
      - name: Upload SARIF to code scanning
        if: >-
          always() &&
          steps.planlint.outputs.status != 'error' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.planlint.outputs.sarif-path }}
          category: planlint
