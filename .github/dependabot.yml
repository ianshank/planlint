# Dependabot configuration for planlint.
#
# Scope is deliberately narrow: GitHub Actions, and the Docker base image's
# digest.
#
# Why not `pip`: this project declares ZERO runtime dependencies
# (`[project] dependencies = []` in pyproject.toml, load-bearing and guarded by
# the stdlib-only test `test_new_modules_stdlib_only`), and the `[dev]` extras
# are intentionally unpinned so contributors and CI resolve the same floating
# tool versions. `tools/check_no_hardcoded_thresholds.py` fails the build if a
# `ruff==`/`mypy==`/`pytest==` pin is reintroduced into the Makefile or a
# workflow. A pip ecosystem entry here would open pull requests arguing with
# that decision on every release, so it is omitted on purpose rather than
# forgotten.
#
# Why Actions matter: every third-party action referenced across
# `.github/workflows/`, the composite action, the adopter template and the
# README snippet is pinned to a commit SHA with its release tag in a trailing
# comment (pin-actions-by-sha). Dependabot rewrites SHA and comment as one
# update and classifies the update from the comment, which is why
# tests/test_workflow_hardening.py requires the comment. The publisher,
# `pypa/gh-action-pypi-publish`, is on a tagged commit rather than a branch
# and stays out of the `actions-minor` group. This closed the deferred row in
# `docs/next-steps.md` ("SHA-pinning the third-party actions"); the earlier
# attribution of that deferral to `docs/distribution-plan.md` was wrong.

version: 2
updates:
  - package-ecosystem: "github-actions"
    # One entry for both directories. Dependabot resolves them against the
    # repository root and discovers workflow files only at "/", so the
    # composite action under .github/actions/planlint/ has to be listed too --
    # and listing both in one entry yields one grouped pull request that moves
    # every copy under .github/ together, which the agreement guard in
    # tests/test_workflow_hardening.py needs now that every ref is a pinned
    # SHA with its release tag (pin-actions-by-sha).
    directories: ["/", "/.github/actions/planlint"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      # One pull request for the routine first-party bumps rather than four.
      # `pypa/gh-action-pypi-publish` is deliberately excluded from the group:
      # it is the only action with write access to a package index, it is
      # pinned to a tagged commit rather than the moving branch it used to
      # ride, and its updates deserve to be read on their own.
      actions-minor:
        patterns:
          - "actions/*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    # The Dockerfile pins its base by digest (harden-ci-workflows), and a
    # digest nobody bumps is a pin that only gets staler; Dependabot moves the
    # tag and the digest together. Labels, as above, are a request: Dependabot
    # ignores a label the repository has not created.
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "build"
