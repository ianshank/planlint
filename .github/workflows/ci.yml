name: CI

# The three long-lived branches of the promotion model
# (adopt-branch-promotion-model): integration, release candidate, production.
# Their names live in pyproject.toml [tool.specgraph.promotion]; GitHub reads
# this list before any step runs, so it is the one literal copy, held equal to
# that table by tests/test_ci_workflow.py.
on:
  push:
    branches: [main, qa, dev]
  pull_request:

# Every job runs with a read-only token unless its own block says otherwise;
# a widening is declared on the job, under a comment naming the step that
# needs it. tests/test_workflow_posture.py holds both halves.
permissions:
  contents: read

# A re-push to a pull request supersedes the run it replaces, so pull
# requests group by ref and cancel in progress. Everything else -- a push to
# a promotion branch above all -- groups by SHA: in a shared group GitHub keeps the
# in-progress run but drops a *pending* one when the next push queues, and a
# merge commit could end with no run at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The single-interpreter Python version lives here and nowhere else in this
# file; every non-matrix setup-python step reads it. The matrix list below is
# the one other place a version is written, on purpose, and the guard holds
# this default to one of that matrix's hard legs.
env:
  PYTHON_DEFAULT: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # A new version enters through an `include:` entry carrying
        # `experimental: true` behind a job-level
        # `continue-on-error: ${{ matrix.experimental || false }}`, and moves
        # into this list after one green run (3.14 did, on run #37522794352). The
        # guard forbids a literal continue-on-error on this job, which would
        # soften every leg at once.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (hard gate — ruff, never silently skipped)
        run: make lint

      - name: Type check (hard gate — mypy, config in pyproject.toml)
        run: make typecheck

      - name: Run tests with line + branch coverage gates
        run: make test

      # The per-leg report is what the floor ratchet reads (measure-coverage-once,
      # R-MCO-12): floors are set two points under the minimum green leg. A red
      # leg's report is uploaded on purpose and excluded by the ratchet; a leg
      # with no report (died before `make test`, or pytest ended at collection)
      # contributes nothing under the action's `if-no-files-found` default of
      # `warn`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ runner.os }}-${{ matrix.python-version }}
          path: coverage.json

  test-windows:
    # The suite's platform guard tests (path separators, console encoding,
    # symlink privilege) only mean something if one leg actually runs on the
    # OS they guard -- ubuntu-only CI let two Windows-only defects ship
    # (fix-windows-path-separator-leak, fix-stdout-encoding-crash), and a
    # third (tests/test_findings_envelope.py's two-checkout normalization)
    # was caught only by a manual Windows run.
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install make (not preinstalled on the Windows runner image)
        run: choco install make -y

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (hard gate)
        run: make lint

      - name: Type check (hard gate)
        run: make typecheck

      - name: Run tests with line + branch coverage gates
        run: make test

      # The per-leg report is what the floor ratchet reads (measure-coverage-once,
      # R-MCO-12): floors are set two points under the minimum green leg. A red
      # leg's report is uploaded on purpose and excluded by the ratchet; a leg
      # with no report (died before `make test`, or pytest ended at collection)
      # contributes nothing under the action's `if-no-files-found` default of
      # `warn`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ runner.os }}-${{ env.PYTHON_DEFAULT }}
          path: coverage.json

  encoding-stress:
    # Reproduces the environment that crashed `planlint validate` before the
    # fix-stdout-encoding-crash change: a console that cannot encode
    # non-ASCII. Runs the no-mocks live track end to end under it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: ascii
      PYTHONUTF8: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Live self-validation under an ASCII-only console (hard gate)
        run: make e2e-live

  self-validate:
    # planlint must hold its own specs to the same rules it enforces.
    # Hard gate: if any change package in openspec/ fails a rule, the build
    # fails — no skip, no soft pass.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Report detected conventions
        run: planlint --target . detect

      - name: Validate every change package (hard gate)
        run: planlint --target . validate --fail-on ERROR

      - name: Emit spec dependency graph
        run: planlint --target . graph --format json > spec-graph.json

      - name: Record warnings as an artifact
        if: always()
        run: planlint --target . validate --fail-on WARN --json > spec-findings.json || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spec-artifacts
          path: |
            spec-graph.json
            spec-findings.json

  packaging:
    # The licence metadata is only observable in a built artifact, and the
    # release workflow is the only place that ever built one — so a packaging
    # regression could not surface until a tag was already pushed, against an
    # index whose versions are immutable. This runs the same check on every
    # pull request instead.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build the wheel in an isolated environment
        run: python -m build --wheel --outdir dist

      - name: Confirm the wheel carries its declared licence
        run: python tools/check_wheel_metadata.py dist

  graph-diff:
    # Fail a PR whose spec graph regresses: more broken_links than the merge-base,
    # or a new orphan requirement (AC-CH-5, AC-CH-6). The base is the merge-base
    # of the PR head and its base branch (DEC-CH-001) — not origin/main — so the
    # gate only flags drift THIS PR introduces, never drift from a rebase or a
    # sibling PR merged after this one branched off.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Checkout the PR head SHA (NOT the default synthetic merge commit) so
      # merge-base resolves to the true branch point (DEC-CH-001 resolution).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Build graph on PR head
        run: planlint --target . graph --format json > head.json

      - name: Build graph on merge-base
        run: |
          git fetch origin "${{ github.base_ref }}"
          BASE=$(git merge-base HEAD origin/"${{ github.base_ref }}")
          git worktree add /tmp/base "$BASE"
          planlint --target /tmp/base graph --format json > base.json
          git worktree remove /tmp/base

      - name: Diff graphs (fail on new broken edges or orphans)
        run: python tools/diff_spec_graph.py base.json head.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spec-graph-diff
          path: |
            base.json
            head.json

  action-contract:
    # The composite action, executed. Every other gate in this repository reads
    # the action as text; this is the only one that runs it, against labelled
    # fixture targets whose expected result is committed beside them. The
    # action shipped once before with an install line that resolved to nothing
    # and no outputs at all, and nothing here could see it.
    #
    # Least privilege on purpose, and asserted: the scan reads untrusted
    # repository content, so it must work with a read-only token and no
    # secrets -- the posture a fork pull request gets.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: passing
            target: tests/fixtures/action/passing
            outcome: success
            status: pass
            exit_code: "0"
          - fixture: failing
            target: tests/fixtures/action/failing
            outcome: failure
            status: fail
            exit_code: "1"
          - fixture: empty-tree
            target: tests/fixtures/action/empty-tree
            outcome: failure
            status: indeterminate
            exit_code: "0"
          - fixture: no-tree
            target: tests/fixtures/action/no-tree
            outcome: failure
            status: error
            exit_code: "2"
          - fixture: nested
            target: tests/fixtures/action/nested/sub
            outcome: success
            status: pass
            exit_code: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # continue-on-error lives on the caller, not inside the action: composite
      # steps do not support it, and the point here is to let a deliberately
      # red fixture report its outputs instead of ending the job.
      - id: planlint
        continue-on-error: true
        uses: ./.github/actions/planlint
        with:
          target: ${{ matrix.target }}
          artifact-name: planlint-evidence-${{ matrix.fixture }}

      - name: Assert the action reported this fixture's labelled result
        env:
          EXPECTED_OUTCOME: ${{ matrix.outcome }}
          EXPECTED_STATUS: ${{ matrix.status }}
          EXPECTED_EXIT: ${{ matrix.exit_code }}
          ACTUAL_OUTCOME: ${{ steps.planlint.outcome }}
          ACTUAL_STATUS: ${{ steps.planlint.outputs.status }}
          ACTUAL_EXIT: ${{ steps.planlint.outputs.exit-code }}
          EVIDENCE: ${{ steps.planlint.outputs.evidence-dir }}
          VERSION: ${{ steps.planlint.outputs.version }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1: expected '$2', got '$3'"
              fail=1
            else
              echo "ok: $1 = $3"
            fi
          }
          check outcome "$EXPECTED_OUTCOME" "$ACTUAL_OUTCOME"
          check status "$EXPECTED_STATUS" "$ACTUAL_STATUS"
          check exit-code "$EXPECTED_EXIT" "$ACTUAL_EXIT"

          # Outputs must survive the composite action's own failing gate step,
          # or every red result above is unreadable to a consuming workflow.
          [ -n "$VERSION" ] || { echo "::error::no version output"; fail=1; }
          [ -d "$EVIDENCE" ] || { echo "::error::no evidence directory"; fail=1; }
          [ -f "$EVIDENCE/run.json" ] || { echo "::error::run.json missing"; fail=1; }

          if [ "$EXPECTED_STATUS" = "error" ]; then
            [ ! -f "$EVIDENCE/findings.json" ] \
              || { echo "::error::an unscannable target must write no envelope"; fail=1; }
          else
            [ -s "$EVIDENCE/findings.json" ] || { echo "::error::no envelope"; fail=1; }
            [ -s "$EVIDENCE/findings.sarif" ] || { echo "::error::no SARIF"; fail=1; }
            [ -s "$EVIDENCE/summary.md" ] || { echo "::error::no job summary"; fail=1; }
          fi

          if [ "$EXPECTED_STATUS" = "fail" ]; then
            grep -q '^::error ' "$EVIDENCE/annotations.txt" \
              || { echo "::error::a failing scan produced no error annotation"; fail=1; }
          fi

          # The action must not write into the tree it scanned.
          git diff --quiet --exit-code \
            || { echo "::error::the action modified the workspace"; git diff --stat; fail=1; }

          exit "$fail"

  security:
    # Secret scan + no-hardcoded-threshold guard (AC-EH-3, AC-EH-6). gitleaks
    # is the real scanner; the no-hardcoded check is a Python script that reads
    # the Makefile and this workflow and fails on a pinned number or tool version.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action looks the repository owner up and, on pull_request
    # events, lists the pull request's commits through the API; nothing else
    # here needs more than contents: read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans history

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: No hard-coded thresholds in Makefile / workflow (hard gate)
        run: python tools/check_no_hardcoded_thresholds.py

      - name: gitleaks (hard gate — committed secrets fail the build)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The build failing is the report; a review comment would need a
          # write permission this job does not have.
          GITLEAKS_ENABLE_COMMENTS: "false"

  docs:
    # The documentation set must exist and be linked from README (AC-EH-8).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
      - run: pip install -e ".[dev]"
      - run: make docs-check

  promotion:
    # The branch promotion model, decided once per run by
    # tools/check_promotion.py from pyproject.toml [tool.specgraph.promotion]:
    # may this pull request's head target its base, and does this run need the
    # release tier? No branch is named here. Always runs, so it can never be
    # the skipped job that reads as a pass.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release-tier: ${{ steps.route.outputs.release-tier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      # Every value arrives through the environment, never interpolated into
      # the script: a head branch name is chosen by whoever opened the pull
      # request.
      - id: route
        name: Check the promotion route and choose the tier (hard gate)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          REF: ${{ github.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: >-
          python tools/check_promotion.py route
          --event "$EVENT" --base "$BASE_REF" --head "$HEAD_REF" --ref "$REF"
          --head-repo "$HEAD_REPO" --base-repo "$BASE_REPO"

  release-tier:
    # The release workflow's gate and wheel smoke test, run BEFORE a tag rather
    # than after one: on every pull request and push into the release-candidate
    # or production branch, as the promotion job decides. The smoke test is the
    # same tool release.yml's build job runs, so a candidate that passed here is
    # the artifact the release will publish. The installed console script is
    # also run against two labelled fixtures, so it is shown to fail a failing
    # tree, not merely to start.
    needs: promotion
    if: needs.promotion.outputs.release-tier == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pull-request code runs here, so the token is not left in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Full enterprise gate (hard gate)
        run: make pre-pr

      - name: Build sdist and wheel
        run: python -m build --outdir dist

      - name: Confirm the wheel carries its declared licence
        run: python tools/check_wheel_metadata.py dist

      - name: Smoke-test the console script in a clean environment (hard gate)
        run: >-
          python tools/smoke_wheel.py dist
          --expect tests/fixtures/action/passing=0
          --expect tests/fixtures/action/failing=1

  ci-ok:
    # The single required status check for the branch rulesets. GitHub counts
    # a skipped required check as passing, and a matrix job's check names
    # change with its matrix, so no other job is required by name: this one
    # runs always and fails unless every job in `needs` succeeded. A job may be
    # skipped only when the condition declared for it below was false on this
    # run. tests/test_ci_workflow.py holds `needs` equal to every other job in
    # this file, so a job added later cannot escape the gate.
    if: ${{ always() }}
    needs:
      - test
      - test-windows
      - encoding-stress
      - self-validate
      - packaging
      - graph-diff
      - action-contract
      - security
      - docs
      - promotion
      - release-tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Every job green, or skipped by its own condition (hard gate)
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        # The release tier is read from the promotion job's own entry in
        # NEEDS, and must be exactly true or false: an empty output (a renamed
        # step id) is exit 2, never "no release tier".
        run: >-
          printf '%s' "$NEEDS" | python tools/check_promotion.py aggregate --needs -
          --event "$EVENT" --release-tier-from promotion
          --pull-request-only graph-diff
          --release-tier-only release-tier
