# Tag-triggered release to PyPI via trusted publishing (OIDC), so no API token
# is stored anywhere in this repo or its settings.
#
# One-time setup, outside this file: register a pending publisher on PyPI for
# project `planlint`, owner `ianshank`, repository `planlint`, workflow
# `release.yml`, environment `pypi`.
#
# The build is gated on the full pre-PR ladder *and* on installing the built
# wheel into a clean environment. That second gate is not redundant: the test
# suite runs the CLI as `python -m openspec_graph.cli`, so nothing else here
# ever exercises the `planlint` console script the wheel actually installs.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# The single-interpreter Python version, read by both setup-python steps and
# held equal to ci.yml's by tests/test_workflow_hardening.py.
env:
  PYTHON_DEFAULT: "3.12"

jobs:
  gate:
    name: Full gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Full enterprise gate
        run: make pre-pr

  build:
    name: Build and smoke-test the wheel
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Licence metadata is only observable in the artifact: setuptools
      # accepts a license-files glob that matches nothing and ships a wheel
      # with no licence at all, silently. PyPI versions are immutable, so
      # this is checked before anything is uploaded, not after.
      - name: Confirm the wheel carries its declared licence
        run: python tools/check_wheel_metadata.py dist

      # The console script is the thing users get and the thing no other job
      # here touches. A fresh venv also proves the package really declares no
      # runtime dependencies: a missing one would surface as an ImportError.
      - name: Smoke-test the console script in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/planlint --version
          /tmp/smoke/bin/planlint --target . detect
          /tmp/smoke/bin/planlint --target . validate --fail-on ERROR

      - name: Confirm the tag matches the packaged version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(/tmp/smoke/bin/planlint --version | awk '{print $2}')"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$TAG" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME does not match packaged version $PKG"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    # Trusted publishing: pypa/gh-action-pypi-publish mints the OIDC token
    # through id-token: write. Nothing else in this job needs more than the
    # top-level contents: read.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
