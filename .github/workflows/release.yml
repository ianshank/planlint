# Tag-triggered release to PyPI via trusted publishing (OIDC), so no API token
# is stored anywhere in this repo or its settings.
#
# One-time setup, outside this file: register a pending publisher on PyPI for
# project `planlint`, owner `ianshank`, repository `planlint`, workflow
# `release.yml`, environment `pypi`.
#
# The build is gated on the full pre-PR ladder *and* on installing the built
# wheel into a clean environment. That second gate is not redundant: the test
# suite runs the CLI as `python -m openspec_graph.cli`, so nothing else here
# ever exercises the `planlint` console script the wheel actually installs.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# The single-interpreter Python version, read by both setup-python steps and
# held equal to ci.yml's by tests/test_workflow_python.py.
env:
  PYTHON_DEFAULT: "3.12"

jobs:
  gate:
    name: Full gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # A release tag belongs on a commit that reached the production branch
      # through the promotion model (adopt-branch-promotion-model); one on any
      # other commit would publish code that skipped the release-candidate
      # tier. The branch is read from pyproject.toml, not named here. Tag runs
      # only: a workflow_dispatch dry run on a branch builds and never
      # publishes, so it has nothing to check.
      #
      # The tool and its configuration come from the production branch, not
      # from the tagged commit: a tag's author controls the tagged tree, so a
      # check read from it could be edited to pass. The repository's default
      # branch is the authority the configured production branch must equal.
      - name: Require the tagged commit to be on the production branch
        if: github.ref_type == 'tag'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git worktree add --detach "$RUNNER_TEMP/production" "origin/$DEFAULT_BRANCH"
          python "$RUNNER_TEMP/production/tools/check_promotion.py" --pyproject "$RUNNER_TEMP/production/pyproject.toml" tag-ancestry --sha "$GITHUB_SHA" --fetch --expect-production "$DEFAULT_BRANCH"

      - name: Full enterprise gate
        run: make pre-pr

  build:
    name: Build and smoke-test the wheel
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Licence metadata is only observable in the artifact: setuptools
      # accepts a license-files glob that matches nothing and ships a wheel
      # with no licence at all, silently. PyPI versions are immutable, so
      # this is checked before anything is uploaded, not after.
      - name: Confirm the wheel carries its declared licence
        run: python tools/check_wheel_metadata.py dist

      # The console script is the thing users get and the thing no other job
      # here touches. A fresh venv also proves the package really declares no
      # runtime dependencies: a missing one would surface as an ImportError.
      # The same tool ci.yml's release-tier job runs before any tag exists, so
      # this step repeats a check the candidate already passed.
      - name: Smoke-test the console script in a clean environment
        run: >-
          python tools/smoke_wheel.py dist --venv /tmp/smoke
          --expect tests/fixtures/action/passing=0
          --expect tests/fixtures/action/failing=1

      - name: Confirm the tag matches the packaged version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(/tmp/smoke/bin/planlint --version | awk '{print $2}')"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$TAG" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME does not match packaged version $PKG"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    # Trusted publishing: pypa/gh-action-pypi-publish mints the OIDC token
    # through id-token: write. Nothing else in this job needs more than
    # contents: read, restated here because a job-level block replaces the
    # top-level one rather than adding to it.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        # `attestations: true` is this action's default since v1.11.0 (the
        # input exists since v1.10.0, where it defaulted to false). Stated
        # explicitly so a SHA pin cannot drop it: a pin at or above v1.11.0
        # makes this line a no-op; against a v1.10.x pin it is what turns
        # attestations on; older than v1.10.0 the action does not know the
        # input and GitHub raises an "Unexpected input" warning annotation on
        # the run.
        with:
          attestations: true
